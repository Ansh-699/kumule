[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = true

# Only one program ships. reward-system and event-escrow were removed: both carried
# placeholder ids that were never real addresses, neither was ever deployed, and medals need
# no custom program - they are MPL Core assets minted to the vault and moved by the vault key.
[programs.localnet]
nftmarketplace = "3ozh4TQJbeyXFUuXsj7fYmHB5aCVkg24cZN5zZmigR44"

[programs.devnet]
nftmarketplace = "3ozh4TQJbeyXFUuXsj7fYmHB5aCVkg24cZN5zZmigR44"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
